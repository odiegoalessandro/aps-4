name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      # A imagem é o artefato entregue; a validação de schema só roda com
      # ddl-auto=validate, que os testes não usam. Um build quebrado precisa
      # aparecer aqui, não no deploy.
      - name: Build da imagem Docker
        run: docker build -t aps-weather:ci .

      - name: Guardar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
