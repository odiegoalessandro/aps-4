spring.datasource.url=jdbc:sqlite:target/test-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=com.aps.weather.demo.config.ApsSQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# O schema do banco temporário vem das migrações, como em produção.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Testes usam a fonte simulada e não disparam a coleta agendada
app.weather.source=simulada
app.weather.simulation.scenario=TEMPESTADE
app.weather.collection.enabled=false
app.weather.collection.pular-repetidos=false

# Fuso de fallback e TTL do snapshot de previsões
app.weather.timezone.default=America/Sao_Paulo
app.weather.forecast.ttl-ms=900000

# Mesma exposição do ambiente de produção, para os testes de actuator.
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
