spring.application.name=aps-weather

# Banco SQLite (mesmo arquivo usado pelo projeto original)
spring.datasource.url=jdbc:sqlite:estacao.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# O SQLite ignora FOREIGN KEY por conexão: sem este PRAGMA a referência de
# weather_forecasts.location_id não é verificada.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=com.aps.weather.demo.config.ApsSQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migrações versionadas (ADR-0001). Um banco já existente recebe baseline na versão 1
# e não reexecuta o V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Fonte: openmeteo (padrao) ou simulada
app.weather.source=openmeteo

# Fuso usado quando a localização não tem timezone preenchida
app.weather.timezone.default=America/Sao_Paulo

# TTL do snapshot de previsões horárias/diárias (leitura read-through)
app.weather.forecast.ttl-ms=900000

# Cliente Open-Meteo: URL base, timeout da requisicao e espera entre tentativas
app.weather.openmeteo.base-url=https://api.open-meteo.com/v1/forecast
app.weather.openmeteo.timeout-ms=10000
app.weather.openmeteo.retry-backoff-ms=1000

# Cenário usado quando app.weather.source=simulada
app.weather.simulation.scenario=DIA_CALMO

# Coleta periódica. O Open-Meteo entrega o bloco "current" em janelas de 15 min
# (current.interval=900) e a coleta deduplica por forecast_at; intervalos menores
# só repetiriam a mesma janela e gastariam requisições sem gravar nada novo.
app.weather.collection.enabled=true
app.weather.collection.interval-ms=900000
app.weather.collection.initial-delay-ms=5000
app.weather.collection.pular-repetidos=true

# Actuator: expõe apenas endpoints de leitura. Detalhes do health ficam ocultos
# para não vazar configuração do banco.
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
